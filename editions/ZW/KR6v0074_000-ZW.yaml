front:
  text: 護國司南抄整理者侯沖題解護國司南抄中國雲南僧人所編纂的漢傳佛教經典疏釋纂集者為雲南大長和國內供奉僧崇聖寺主義學教主賜紫沙門玄鑒原書有疏釋五卷校勘錄一卷玄鑒纂集該文獻的時間為雲南大長和國安國六年公元年今存本為大理國保安八年公元年釋道常抄寫疏釋一卷隋唐時期的佛教撰述其疏之注釋常曰疏抄護國司南抄就是玄鑒對良賁仁王護國般若波羅蜜多經疏以下簡稱良賁仁王經疏的注釋所注並非良賁仁王經疏的全文而是其中的部分文句或字詞玄鑒注釋良賁仁王經疏不僅引述漢地佛教經籍也引錄儒道兩家要籍從中可以看出南詔時期雲南僧人的佛學水平以及中原儒道思想和漢傳佛教對南詔文化的影響程度玄鑒所引錄的部分典籍今已不存護國司南抄引錄這些書的部分內容保存了較為珍貴的文獻資料玄鑒有義學教主之稱號故本文獻亦為我們瞭解中國古代義學僧人提供了難得的實物資料本文獻未為中外歷代大藏經所收也未為中外歷代佛書著錄年月在雲南省大理白族自治州鳳儀北湯天董氏宗祠發現卷軸高釐米當時已分作三段其中首尾兩段現藏雲南省社會科學院圖書館中間一段現藏雲南省圖書館由於分藏不同的單位一般學者大都未見到原件而見到本文獻的人又不能仔細閱讀原文並作出正確的鑒別故前人有關本文獻的介紹大都有誤如以玄鑒為密學或密宗教主以現存抄本為南詔時期抄本就是其中最典型的錯誤隋唐時期的佛教經典傳抄經論則真書而註疏則草書雲南佛教唐初才經四川等地傳入經籍的傳抄與漢地當時的風尚相一致故即使是大理國時代的寫經亦大致保留了南詔時期抄經的習尚即經論用正書註疏用草書本文獻或者因其為註疏之註疏或者因其乃抄備個人使用故用更加簡便的草書乃至自創的略書寫成所謂略書往往是一些字的偏旁部首如護國作戶口波羅密作皮羅宀金剛作金刂這些略書過去因為難於識讀而一直被誤為白文由於現存的護國司南抄用行草乃至略書寫就且有不少字為抄者自造頗不易識讀加之重抄疏釋存在不少錯誤並有一些地方模糊不清故整理者雖數次抄錄辨識但仍有一些字未能識別有些字的辨認亦無十分把握當然由於條件限制未能一一查對本抄所引諸書亦是未能全部辨識本抄文字的一個原因因此此次發表的整理本還存在種種問題還有不少語義不通之處希望將來有高明能在這個整理本的基礎上整理出更完善的本子本抄首段和末段據雲南省社會科學院圖書館所藏本文獻的原件錄文整理中間一段據雲南省圖書館藏縮微膠片錄文整理無校本錄文攝彼十字皈於一字從廣至略漸減漸深一字現前同於法界性相平等至究竟故
