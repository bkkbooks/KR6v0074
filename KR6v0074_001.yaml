body:
  text: 內供奉僧崇聖寺主義學教主賜紫沙門玄鑒集敘曰般若寶經義崇護國仁王遵奉道侶任持故得三寶光生七難氛息疏主三藏業稱內外學洞古今翻譯文潤於斯經習共贊義皎乎茲疏文約而詣理邃而彰聰岫之雞冠貫滄溟龍頷至如釋文體廣括群鑒講習之流卒難尋究今因演次檢而録之繕寫既周勒成五卷防泣路備迷方故目之云護國司南抄耳並校勘録一卷附第五末但集經論豈述懷幸諸忘鑒莫我瑕矣時安國聖治六載甲寅歲朱夏之季月也良賁音祕易曰賁飾也補闕鈔圖云良賁俗姓王氏太原人也博通經論薄間莊老遭逢衆難息靜隱居後於大明宮詔令修疏時年八十二鑽研諷味期歲方畢詔述切韻云詔謂敕書也述修也稽首下據補闕鈔圖釋皈敬序分二初顯所敬境稽首下至盡敬禮分二初別明三寶分三一佛寶稽首已下至無與等分三一法身稽首無上覺二應身體遍相圓明三化身應現下至無與等二法寶所說已下至不可測分二一教體所說下至修多羅二教用巧濟下至不可測三僧寶住果下至聖凡分三一小乘僧住果勝果道二中乘僧麟喻部行尊三大乘僧五忍諸聖凡後總結敬禮我今盡敬禮後請威加護三寶悲智力下至利含識稽首無上覺稽首鄭玄注周禮云稽至也首頭也以頭至地故云稽首此表敬之極也金剛經道智抄云西國有三種禮下者揖中者跪上者稽首體遍相圓明下經云同真際等法性疏云真言真際即是法身若云同者智同理也是智德身此與法身非即非離俱遍法界常安樂故名體遍也所說甘露法如下經云此經名為仁王護國般若波羅蜜多亦得名為甘露法藥若有服行能愈諸疾顯隱詞云諸天以種種名藥投於大海四天王十寶山研之遂出精華狀如凝蘇食之長生曰甘露住果勝果道三乘入道疏抄云住果謂四果也勝果道謂四向也向謂趣求果謂剋獲道類忍前十五心名須陀洹向第十六心道類智處立為初果進斷修或一品至五皆得名為第二果向即此名為勝果道也唯有初向不背於前後之三向皆有二義一勝前果得名勝果名勝果道道是因義麟喻部行尊顯隱詞云麟喻即獨覺出者喻如麒麟唯有一角即出無佛世界入末法中不見佛不覩教此由過去宿習種子故佛出世天作是言佛欲出世各當滅度麟角聞已涅槃佛方出世也部行即是衆出者出有佛世見佛聞法部類而也五忍諸聖凡顯隱詞云聖是如理僧十地菩薩也凡是信解僧資糧加行也資糧是外凡加行是內凡故讚真文切韻讚明也助也粵真理下釋名起序分二初明能說教主三身分二初通讚三身真理下至塵剎分三一法身真理下至之表二應身智鏡下至之源三化身德海下至塵剎後別彰化體牟尼下至摩尼照物後明所說法利用難測分三初讚略八品所以下至窒諸欲者矣分二初別所以下至深誡分八一明序品所以下至法雨分二初總陳序品所以下至嵒谷後略彰二護遂得下至法雨二觀如來品宗陳下至俱寂三菩薩行品啓五忍下至在目四二諦品談二諦下至唯心五護國品帝釋下至之悟六不思議品花彰下至難思七奉持品十三法師下至寰區分二初明十三法師奉持十三法師下至指掌後明十六國王奉持七難下至寰區八囑纍品恐季葉下至深誡後總若非大明下至窒諸欲者矣次翻譯由緣皇唐八葉下至真風永扇後造疏所以良賁下至庶照玄造矣粵音越華嚴音義云發語之端也德海揚波汩清流於塵剎從真智德海揚俗智恩波如下經云二利自在如水與波疏云水喻本智波喻後智汩音骨周語曰汩決九流注云汩通也清流喻化身也謂從本智德海起後得恩波通清流化身塵剎中也故經云乘一切智乘來化三界動而寂若清月淩空宗密疏抄中據經頌云譬如淨滿月影現一切水月影雖無量本月未曾爾語而默等摩尼照物下經云如摩尼寶體具衆德乃至若於暗夜置高幢上光照天地明如日出此般若波羅蜜多亦復如是疏云此則能為生死長夜大黑暗中寶炬智燈令受持者發生三惠破無明暗如日出故住定興悲經云初年月八日入大寂靜等住定也經云從三昧起乃至吾知十六諸國王等興悲也光馳聚日經云身諸毛孔放大光明普照十方等最勝王經云身光朗耀如百千日波斯匿王等霧集煙凝經云復有十六大國王波斯匿王等各與若干千萬眷屬俱等亂墜天花經云是時欲界無量諸天雨衆妙花色界諸天亦雨天花時無色界亦雨香花等坦夷嵒谷廣雅曰坦夷平原也經云香如須彌花如車輪故諸嵒谷花香填之坦然無高下也宗陳護國下疏云意明護國為經之主乃理事雙彰經云以諸法性悉皆空故是理由世諦故下是事則境智俱寂經云智照實性非有非無疏云明能照智稱境而觀非有非無通境智矣又云故聖人以無心真智照無相虛宗內外兩冥境智俱寂即其照也啓五忍而行位在目菩薩行品啓五忍為四忍廣明行位如經文云依五忍法以為修行等談二諦而迷悟唯心二諦品經云於解常自一於諦常自二了達此一二真入勝義諦楷疏云真俗有二初約心者迷情妄執皆是俗諦聖心語解皆是真諦後約境者一切諸法為四相所遷無問有漏無漏皆亦俗諦真如法性不為四相所遷皆是真諦此約心而言故云迷悟唯心帝釋卻頂生之軍普明開斑足之悟護國品經云往昔過去釋提桓因為頂生王等又云昔天羅國王有一太子名曰斑足等花彰令德力現難思不思議品經云一花入無量花無量花入一花等令去音美也善也十三法師文昭昭乎指掌奉持品經云從初習忍至金剛定如法修行十三觀門皆為法師依持建立等昭昭明白見也七難氛息光炅炅乎寰區下經云是諸國中若七難起一切國王為除難故受持解說此般若波羅蜜多七難即滅等炅炅切韻古頂反光也恐季葉雕殘故永言深誡囑纍品經云今誡汝等吾滅度後等文選注季末也葉代也窒諸欲切韻窒塞也皇唐八葉切韻皇大也文選注云葉代也帝王目録云高祖諱淵太宗高祖第二子諱世民高宗太宗第九子諱治則天諱華命中宗高宗第七子諱顯睿宗高宗第八子諱旦玄宗睿宗第三子諱隆基肅宗玄宗第三子諱亨代宗肅宗長子諱豫無垠切韻五根語斤二反岸也正形有截孝經注云形法則也毛詩傳云有截整齊言四海之外率服截爾率整也震頽綱唐韻震起也切韻或作振舉也黔庶衆經音義云上黑也下衆也謂黑青衆人也先哲切韻哲智也有點清流切韻點枉也清流謂諸碩德名賢故西域記中諸少年僧輕脅尊者曰濫迹清流徒知飽食叨接切韻叨忝也辱也謬膺切韻膺當也幸揚切韻揚對也天闕書云闕缺也闕在門兩旁中間缺各為道竊玄珠於貝葉是譯經時潤文兼筆受又修疏時此經也捧白壁等是修疏時捧此經也或捧詔書也故上云幸揚天闕親奉德音又春秋語曰賜黃金百溢白壁一雙庶昭切韻庶望也昭明也五常之首論語疏云謂仁義禮智信好生惡煞博愛不愚曰仁舉動合宜除亂不害曰義疏通知遠逆覩未來曰智上下彰明恭儉不煩曰禮舉事無怨語無翻覆曰信此五德者不可造次而虧不可須臾而廢王者履之以治國君子奉之以立身用無暫替故云常也又云就五行而論則木為仁火為禮金為義水為智土為信人稟此五氣而生則備有仁義禮智信之性人有博愛之德為仁有嚴斷之德為義有明尊卑敬讓之德為禮有照了之德為智有言不虛妄之德為信此五者人性之恆不可暫捨故謂之五常又辨正論云此五常在天為五星在地為五嶽在處為五方在人為五藏在物為五行不煞曰仁主肝木之位春陽之時萬物盡生正月二月少陽用事養育群品好生惡煞煞者無仁不邪淫曰義義主肺金之位七月八月少陽用事外防嫉妒危身之害記憶體性命竭精之患禁私不淫淫者無義不飲酒曰禮禮主心火之位四月五月太陽用事天下太熱萬物發狂飲致醉心亦發狂口為妄語亂道之本身致危亡不盡天命故禁以酒酒者無禮不盜曰智智主腎水之位十月十一月太陽用事萬物收藏盜者不順天以得物藏之故禁以盜盜者無智不妄語曰信信主脾土之位三月六月九月十二月中央用事制禦四域惡口傷人禍在口中言出則殃至氣發則形傷危身速命故禁以舌舌者無信仁正月二月春義七月八月夏禮四月五月夏智十月十一月冬信三月六月九月十二月中央三才文選云體三才之茂注云三才謂天地人也閫城切韻閫苦本反門限也識浪楞伽云藏識海常住境界風所動種種諸浪識騰躍而轉生業境界風動生諸識浪也煩籠有本作樊字毛詩注云樊藩也藩籬也莊子音義云樊籠離之所連綴以教詮義如線貫花攝持以教被理如經持緯區分顯隱詞云區別也又區域也區域不同種類各別故名區分序者如宅無牆一客來則不內外宅之淺深也彚聚顯隱詞云上云貴反於也亦云品別無差別中差別而說第一顯隱詞云第者次第即非色心一者一二即為數識第之與一並不相應行法攝也人法雙彰仁王人也護也宗體止迷記云宗尊也崇也主也族也首也意如客有十國即一人為世尊今說般若即以般若為宗如法師歸分別鳥歸林藪人歸屋宅佛歸涅槃百川歸大海根緣根純緣熟感赴如最勝王經譬如日月無有分別亦如水鏡無有分別光明亦無分別三種和合得有影生衆生有感現應化身亦復如是處會如說般若處即四處會即十六會也各對宜聞對須菩提說般若空教以須菩提解空第一故對虛空藏菩薩說三身品疏云以表佛身如虛空藏隨衆生意行財法施故今對國王廣陳二護是通聞也十四王下經云世尊善說十四王疏云三賢十地及等覺菩薩為十四也有聖有凡聖即十地凡即三賢黎元黎衆也元善也全身尚輕半偈斯重義如下第五卷中具釋菩提涅槃從生了因玄開疏云報化二身相同有為經能為生因如種等芽芽始生故法身實性名諸佛覺法體是無為經但為了因如燈照物物先有故四智菩提是報身從生因所感涅槃是法身從了因所感凝然相續者牒上菩薩涅槃也菩薩是報身是相續常涅槃是法身是凝然常故顯隱詞云法身是凝然常所謂真如法性湛然常住無變無遷也報身是相續常謂無量劫中修行六度萬行得四智菩薩於得土中為登地已上菩薩說法相續不斷名相續常化身是不斷常謂雖示生王宮現滅雙樹只為衆生根性未熟化身即來喻如盆水若清月影即現常應有緣不斷名不斷常諒在切韻諒力讓反信也實也重昌堯化帝王略論云陶唐氏名放勛黃帝之孫姓伊祁聰明文思允恭克讓以尹壽為師許由為友堂高三尺茅茨不剪土階三等夏日葛衣冬日鹿裘有草生階以月初一日生一葉至十六日落一葉至三十日盡若月小則一葉厭而不落名蓂英堯觀之以知旬朔又生莆音晡於廚其形如萐名莆萐署月廚內常涼切韻萐山輒反瑞草也又玉編云孝德至萐莆出堯廚樹名也其葉不搖自扇於飲食中清涼助供養甘露降醴泉出朱草生鳳凰上逢故仲尼云唯天為大唯堯則之時有老人擊壤於路曰吾日出而作日入而息鑿井而飲耕田而食帝何力於我哉革弊切韻革改也弊斃也困也救焚液疏抄云拯溺救焚往時萬姓如火焚燒如泥沈溺苦之甚也武王再詔天下萬姓昭蘇如救焚溺也社稷白虎通土神曰社穀神曰稷非土不居非穀不食土地廣博不偏敬五穀衆多不可一二而祭故封土立社必有土尊五穀之多故封稷而祀之仙駕歸天釋詞云天子崩亡褒之曰仙駕謂若群仙承龍駕鶴者也禮樂惟新白虎通云王者制禮作樂節民之喜怒也樂以法象天禮以法象地人無不含天地之氣有五常之性者故樂所以蕩滌反其邪惡也禮所以防淫佚音逸淫樂過也節其侈靡切韻上尺氏反上聲奢也下文彼反亦奢侈也禮以安上治人樂以移風易俗也明白四達老子云明白四達能無知乎注云人君能為雌靜則萬姓樂推其德明白四照猶須忘功不宰故云能無知乎恭嗣切韻恭敬也奉也嗣繼也惠洽切韻洽霑也知也融通切韻融明也寇盜尚書注云群行攻劫曰寇允穆切韻上信也誠也下和也曠劫切韻曠遠也月朔易曰月一日為朔朔蘇也死而復蘇朔始也言更有終始也月望易曰望月滿之名也日在東月在西猶君臣之相望也一轍切韻車迹也如維摩經不思議為宗經文廣顯不思議理所以為宗疏云只如三千大千變現微蓋之內得土穢土回護品指之間命高屋於東方取香飯於上國纖毫吞於巨海小芥納於須彌呼吸風雲擲弄日月擎大會於掌內還論庵園接妙喜於指端遠安此國法華經以一乘為宗經云十方佛土中唯有一乘法無二亦無三除佛方便說顯隱詞云乘有四種一理二空真如乘之性故故無性攝論云或乘大姓故名大乘二教音聲名句文詮顯大乘故三行無偏六度能運載故無性攝論云亦乘亦大故名大乘四果菩薩涅槃乘家果故此之四種對彼二乘名為一乘二既非二一亦非一非一之一名為一乘故高祖諱淵在位九年年七十隋朝義寧二年戊寅五月二十日受恭帝禪位改為武德元年太宗高祖第二子諱世民在位二十三年年五十二武德十年初改為貞觀元年高宗太宗第九子諱治在位三十五年年五十四貞觀二十三年太宗崩皇太子治即帝位號高宗天皇大帝至貞觀二十四年正月一日改為永徽元年庚戌永徽六年正月七日改為顯慶元年乙卯顯慶七年三月十七日改為龍朔元年龍朔五年正月一日改為麟德元年麟德三年正月五日改為乾封元年乾封三年二月三日改為總章元年總章二年三月三日改為咸亨元年咸亨五年八月五日改為上元元年上元三年十一月十八日改為儀鳳元年儀鳳四年六月三日改為調露元年調露二年八月三日改為永隆元年永隆二年十一月十七日改為開耀元年開耀二年二月十九日改為永淳元年永淳三年十二月四日改為弘道元年則天諱華命在位二十一年年七十八弘道二年正月一日武氏監國改為嗣聖元年乙酉至二月七日改為文明元年至九月三日改為光宅元年光宅二年正月一日改為垂拱元年垂拱五年正月一日改為永昌元年至十一月二日改為載初元年二年九月九日革命國號大周聖母臨朝稱皇帝改為天壽元年天壽三年四月一日改為如意元年至九月九日改為長壽元年長壽三年五月十一日改為延壽元年延壽二年正月一日改為證聖元年至九月九日改為天冊萬歲元年至臘月十一日改為萬歲登鳳元年萬歲登鳳二年四月一日改為萬歲通天元年萬歲通天二年九月九日改為神功元年神功二年正月一日改為聖歷元年聖歷三年五月五日改為久視元年久視二年正月三日改為大足元年至十月二十三日改為長安元年此非八葉所也中宗高宗第七子諱顯在位五年年六十長安五年正月二十五日中宗即位改大周還為大唐改為神龍元年丙午神龍三年九月五日改為景龍元年睿宗高宗第八子諱旦在位三年年五十五景龍四年六月四日溫王重茂即皇帝位韋氏監國改為唐隆元年至六月二十四日溫王讓位於叔相王睿宗即位七月二十六日改為景雲元年辛亥景雲三年正月十九日改為太極元年至五月十三日改為延和元年至八月七日又改為先天元年玄宗睿宗第三子諱隆基在位四十四年年七十一先天二年七月二十七日睿宗上室號與太子為開元神武皇帝十一月一日改為開元元年甲寅開元三十年正月一日改為天寶元載肅宗玄宗第三子諱亨在位六年年五十天寶十五載七月二十七日即皇帝位至八月十五日改為至德元年丁酉二帝至德三年三月改為乾元元年乾元三年四月改為上元元年代宗肅宗長子諱豫在位一十七年年六十上元三年五月改為寶應元年癸卯寶應二年八月改為廣德元年至廣德三年正月一日改為永泰元年永泰二年十二月改為大歷元年南天竺西域記云詳夫天竺舊云身毒或曰賢豆今從正音宜云印度印度者唐言月其猶白日既隱雖有星光言照豈如朗朗言明良以其土聖賢繼軌導凡御物如月照臨故謂言印度五印度境周九萬餘里三垂大海北背雪山北廣南狹形如半月涅槃經音義云印度名月月有千名斯其一稱執師子國唐三藏傳云國周七千餘里都城周四十餘里人戶殷稠穀稼滋實黑小急暴此其俗也國本寶渚多有珍奇其後南印度有女聘鄰國路逢師子王侍送之人怖畏逃散唯女獨在車中師子來見負女而去遠入深山採果逐禽以用資給歲月既淹生育男女形雖類人而性暴惡男漸長大白其母曰我為何類父獸母人母乃為陳昔事子曰人畜既殊何不捨去而相守耶母曰非不有心但無由免脫子後逐父登履山谷察其經涉他日伺父遠去即擔攜母妹下投人里至母本國訪問舅氏宗嗣已絶寄止村閭其師子王還不見妻子憤恚出山咆吼人里男女往來多被其害百姓以事啓王王率四兵簡募猛士將欲圍射師子師子見已發聲瞋吼人馬傾墜無敢赴者如是多日竟無其功王復賞告令有能煞師子者當賜億金子白母曰饑寒難處赴王募如何母曰不可彼雖是獸仍為汝父若其煞者豈復名人子曰若不如是彼終不去或當尋逐我等來人村閭一旦王知我等還死亦不相留何者師子為暴緣娘及我豈有為一而惱多人二三思之不如應募於是遂行師子見已馴伏歡喜都無害心子遂以利刀開喉破腹雖加此苦而慈愛情深含忍不動因即命絶王初聞歡喜怪而問之何因爾也竟不實言種種窮迫方乃具述王曰磋乎非畜種者誰辦此心雖然我先許賞終不違言但汝煞父悖逆之人不得更居我國敕有司多與金寶逐之荒外即莊兩船多置黃金及資糧等送著海中任隨流逝男船泛海至此寶渚見豐奇玩即便止住後商人將家屬採寶復至其間乃煞商人留其婦女如是産育子孫經無量代人衆漸多乃立君臣以其遠祖執煞師子因為國稱女船泛海至婆剌斯西為鬼魅所得生育群女今西大國是也竹林園白鷺池止迷記云即迦蘭陀長者施此竹林以為精舍迦蘭陀者云好鳥類以鵠群飛多棲竹林昔有國王出城遊觀息此竹下王時正睡有蛇來欲螫王鳥見蛇來一時驚飛以寤王睡王因鳥覺得免蛇災便以竹林將養此鳥乃命林主以時散食養鳥迦蘭陀鳥故林主以養迦蘭陀鳥時人謂之迦蘭陀長者林側有陀曰鷺棲集其中謂鷺陀長者於此池側建立精舍亦是如來說經之處又依唐三藏說云長者先以林將施以外道後生悔心欲以施佛是時地神知長者意乃於林中現龍蛇等種種怪異驚之欲令出去外道惶怖仍不出地神顯形而怒之曰汝宜速出不得住此主人以林欲將施佛外道懷慚捨之而去外道去已便將施佛最勝天王止迷記云他化自在天王亦名最勝曼殊室利止迷記云此云妙吉祥亦云妙德是過去平等龍種上智尊王佛那伽室利止迷記云那伽此云龍室利此云吉祥蕩洋切韻上緒朗反蕩滌除也非此之意合作蕩字切韻蕩大搖放動也又廣遠也水在河內也下指音水流音也渤澥海別名也佛果久近握鏡融心時久成佛者如下經云此十四忍若佛菩薩不由此門得一切智者無有是處又如疏云大果難感故經五忍萬行難備漸次而修從因至果為十四忍時近成如下經云但斷三界無明盡者即名為佛握持也融明也修行之人若遇此經即知成佛久近加持明鏡心中明白也淨信則福越河沙如經云若有人於恆河沙三千大千世界滿中七寶以用為施大千世界一切有情皆得阿羅漢果不如有人於此經中乃至起於一念淨信持讀乃災殃霧卷如下經云若國欲亂鬼神先亂鬼神亂故即萬人亂當有賊起百姓喪亡國王太子王子百官互相是非天地變怪日月衆星失時失度大火大水及大風等是諸難起皆應受持講讀此般若波羅蜜多乃至無量過咎悉皆消滅現迹王宮現八相生天降神納妃出家苦行成佛轉法輪入涅槃教理行果教謂音聲言教理謂法界行謂般方便果謂淨土法身如意寶者維摩疏云此四天下有一金翅鳥食四生龍名曰正音壽八千歲日食一龍命欲終時諸龍吐毒不復能食罪於金剛山頂毒氣發火難陀龍王恐燒寶山降雨澆之身肉消盡唯餘其心大如人髀純琉璃色帝釋得之為髻中珠三寶於是現世間疏云覺道既成佛寶也法輪即轉法寶也五人出家得道僧寶也因犯制戒如律中云時阿那律迂行有一女人隨那律後女人夫智求妻不得復見阿那律後行夫言那律共其女人其遂亂打那律從此佛制比丘不得共女人同道行也梗概切韻云謂大略也雞薗西域記云王舍城東南有屈吒阿濫摩僧伽藍唐言雞園無憂王之所建也無憂王初信佛法也式遵崇建修植善種召集千僧凡聖兩衆四事供養什物周給造此伽藍所居之也無憂王者如來入涅槃後第一百年有阿輸迦唐言無憂舊曰阿育者訛也阿㝹樓豆阿那律或云阿奴侯反樓豆大術經大術經即是摩訶摩耶經是佛親生之母有大幻術故名大術揚摧音崔莊子音義云粗略法門也又云摧略也而揚顯之也因或具闕衆生因中具有實相性闕觀照用具實相性者如下經云一切有情此為覺性等闕觀照用者有全闕者有得者若十信已前有退有進如輕毛等全闕觀照用若十住已後依五忍法以為修行疏云經說五忍即是慧故分得觀照用也諒在上信也實也周星隱耀客準周書異記云周昭王二十四年甲寅歲四月八日神光五色貫入太微先遍西方漸入東夏問太史蘇由曰是何祥也由曰有大聖人生在西域一千年外聲教被此鐫石理之在於西郊佛生時也普曜經云普放大光照三千界即左傳說恆星不現夜明也漢日通津法本記及釋迦方志云後漢明帝永平三年夜夢金人身長丈餘項佩日月光飛行殿前帝問何瑞傅毅答曰臣聞西域有神名佛陛下所夢將必是乎敕遣郎中蔡愔上七蓋反下於淫反博士秦景等從雪嶺南西入天竺圖佛形像尋訪沙門摩騰法蘭同屆東洛佛滅至今大唐大歷十二年丁巳歲計有一千七百五十六年勿懷取捨而欲指南若取空捨有須道一邊非契中道如車上人常指南方便著一邊也書云如郊謁太清太廟用指南車將引天子東西南北行時車上人常只指南既知南已即知三定所也仁王則請主彰廣敬之令暮仁王則請主者下經云時波斯匿王即從座起頂禮佛足合掌長跪而白佛言世尊菩薩摩訶薩云何護佛果云何護十地行疏云三業至誠利樂故問問仁王何須為請主耶答是彰廣敬之令暮也故下疏云上行下化令去聲善也美也又暮計有作謀謨皆同護國則所為陳博愛之鴻業據法華疏為去聲求也護國則所為者下經云世尊大慈普皆利樂我等諸王云何護國此護國之法是仁王所願求者也故下觀如來品疏云次為外護滿本所求又護國品疏云遂諸王願有此品故又囑纍品疏云此令三寶久住非王不能建立誦讀之所滿請主所為故囑付非餘問仁王何須求護國法耶答是陳博愛之鴻業也博廣也鴻大也有恩親故親愛也拱揖爾雅云兩手持為拱又論語疏拱宗也拱崇敬也揖讓也謂讓位也遜接遜蘇困反懼也毅音義嚴也又果敢也儒者儒者濡也夫習學事久則濡潤其身故謂久習者為儒也說文王字德貫三才古之造文者三畫而連而中貫之為王三者天地人也有德者道貫此三名為王矣兆庶乂安萬萬億曰兆庶衆也乂康也詞云天子曰兆民兆庶諸侯曰萬民序者因由也東西牆謂之序此人作舍宅先作東西牆辨其內外而為堂宇之由漸又序別內外也何者如宅無牆客來則不別內外宅之深淺也學者非覽序終不測作者之意次第深淺也故知見牆方委宅之內外披序方知作者之意由致致謂引而至之又到也鴻盧卿九卿中一卿也九卿者太常卿主禮樂衛尉卿主甲仗光祿卿主酒食鴻盧卿主僧尼賓客司農卿主薗苑正卿主宗室大理卿主囚太僕卿主馬太府卿主庫藏東夏西天處雖懸曠道安法師在東夏親光菩薩在西天故云懸曠懸遠也曠廣也北首而臥首向也娑羅樹者此云堅固林表示如來真身堅固不可破壞涅槃經三十七云佛告諸弟子我今時至舉身疼痛於七寶床右脅而臥頭枕北方足指南方面向西方後背東方娑羅樹林四雙八隻西方一雙在如來前東方一雙在如來後北方一雙在佛之首南方一雙在佛之足梵壇治之梵謂梵王壇是宗法默擯為是梵壇治也為梵子有過令諸梵衆默不共語佛令比丘學梵王法故云梵壇治又顯隱中有二解一云梵王治惡性人法作壇令惡人壇中獨坐不令共語二云約二禪已上廣如司南第二中說梁武帝姓蕭名衍在位四十九年雖億兆務繁而卷不釋手內外典籍皆為訓解受佛得戒崇信日增自與僧講涅槃經制五時論常供千僧內並行六齊八戒三度捨身入常住群臣奉贖日止一食永絶辛膻莒蜀進藕芋言似肉味制不得進敕天下綾錦不許作鳥獸文裁剪之時實所不忍太廟祠祀以蘇麥為三牲阿難過去作長者時供養誦經沙彌金藏要集云昔過去久遠有一比丘畜一沙彌常令誦經晝夜誡敕無有休廢若誦經少即被呵責至欲中時復遣乞食若稽留誦經不充恐師瞋責此沙彌甚為愁惱為師乞食且誦且行時有長者怪而問之沙彌爾時具以事答長者聞之即語沙彌勿生憂惱從今已後常相供給宜常精勤誦習經典時此沙彌賴此長者不復乞食專心誦經常得充足爾時師長乃往過去光佛是誦經沙彌今釋迦佛是施食長者今阿難是由過去時常施誦經沙彌食故有大功德智惠淵廣多聞博達佛所咨嗟總持第一能自開智開者顯也此本智起顯真理二障云亡能自生起故如睡覺智如人夢中作夢唯自知故餘人不了此智亦爾唯佛自知十地不了寫瓶有寄故囑傳燈涅槃經第二十八云師子吼言阿難比丘受持讀誦十二部經為人開說正語正義猶如寫水置之異器阿難比丘亦復如是從佛所聞如聞轉說菩薩形異處疏疏遠也佛剃髮染衣菩薩寶冠瓔珞故云形異菩薩隨緣利生故云處疏羯尼迦樹此云黃金花樹似此方槐樹其花稍似花又金花樹花色如金含異香將此花和巨勝押油塗身逆風五十步聞香八戒中不得香油塗身者是頻毗娑羅此云影肩即阿闍世王之父阿闍世此云未生怨其子名阿輸迦又云阿育此云無憂罹災上音離憂也又罹者被也攘以手禦人又卻乃命太子即阿闍世知東宮之事命囑也監攝監臨察明也憲法也時吠舍離主吠舍離城去王舍城二百餘里戎裝欲襲戎服戎武軍也兵也襲者有鐘鼓曰伐無曰討掩其不備曰襲邊侯聞命命告也基本也趾音止足也鷲即鵰也鷲鳥黑色多子也釋迦菩薩化受鷲身如來過去為鷲鳥多取水穀米於此山中養育父母今日成佛於此說法報昔日恩爾接北山之陽山南曰陽山北曰陰若是河南岸曰陰北岸曰陽孤標特起近有諸小山象頭山毗富羅山等此鷲峰山最高故云孤標垂五十年垂近也自麓音鹿之峰麓者山腳也之往也山頂曰峰跨壑淩嵒跨越也又逾陰曰跨登峻曰淩一為下乘即王至此下乘彼法重人顯為後軌二謂退凡一云凡者凡庶意者是皇親帝戚即得同往不是者即簡退二云凡者凡夫有經說王宮總是初果聖人簡凡夫不令用往大軍萬二千五百人為軍五百人為旅如共一船憂喜同故易云同舟而濟則胡越何患乎異印璽斯爾反璽印也又曰天子之璽以玉為之古者尊卑通用自秦以來唯天子得其稱也法謂軌持軌謂軌則令生解故持謂任持持自性故待衆緣故待藉也大蟒摸朗反大蝦蟆也或長二十里或三十里或四十里准下經長五百由旬田蛗正作䘀房久反蛗螽音終秋蟲也法華疏作田蚥扶宇反玉燭云即旱地蝦蟆蟲蛇水蛤等皆是腹行之類此等皆上山聽經來慳儉巨險反去奢縱約謂之險或眉間流照表示一乘是法華經第一云爾時佛放眉間白毫相光照東方萬八千世界靡不周遍下至阿鼻地獄上至阿迦尼吒天於此世界盡見彼土六趣四生又見彼土現在諸佛得聞諸佛所說經法或合蓋現奇彰難思德是維摩經爾時毗耶離大城有長者子名曰寶積與五百長者子俱持七寶蓋來詣佛所頭面禮足各以其蓋共供養佛佛之威神令諸寶蓋合成一蓋遍覆三千大千世界皇唐御歷建寅為正西國三際際各四月即同往古建子為正黑半標元書云周統天以建子之月為正者其時萬物養根於黃泉之下色尚赤赤主太陽太陽者天也故稱天統以夜半為朔殷統地以建醜之月為正者其時萬物始萌牙色尚白白者陰氣陰氣者地也故稱地統以雞鳴為朔夏統人以建寅之月為正者其時萬物敷甲而出革變人眼目色尚黑人得加功故稱人統以平旦為朔最勝王疏云三際者謂寒熱雨際從十一月十六日至三月十五日為寒際從三月十六日至七月十五日為熱際從七月十六日至十一月十五日為雨際間錯錯雜也為經之主主謂宗主也明其報得謂天帝釋斑足王講讀般若又過去復有五千國王常誦此經現生獲報等此兼人法云觀如來此觀如來品據羅什譯本云觀空品初一善哉讚他心德吾知十六諸國王等咸作是念等次一善哉讚起悲深吾今先為諸菩薩摩訶薩等涉有未始迷空始曾也於恆河沙三千大千世界且觀阿耨池革竿大千界又云摩竭陀國西北有黑山三大六小九黑山北有雪山雪山北有香醉山何云香醉山香氣芬馥人聞即醉春夏秋時人不得過冬月方得香氣歇故阿羅漢受變易身最勝王疏第五卷云雙賢法將以前導群聖象子而後隨迦葉入雞山而不皈阿難蹈恆水而長往等不入無餘涅槃皆是變易身也雙賢法將以前導者論云二月十五日臨般涅槃時舍利弗不忍見佛涅槃辭佛於羅閲城於摩庾村本生處入涅槃目連見舍利弗入涅槃亦辭佛於摩庾村本生處入涅槃此二尊者並才識明敏位望崇高夙契蘭芳終嘗露味加以侍佛即各居一面和僧即共號雙賢群聖象子而後隨者智度論第二云佛滅度後迦葉召千羅漢會耆闍山將集法藏時夏三月初十五日說戒時坐定諸羅漢議云誰能結集毗尼法藏阿泥盧豆言憍梵鉢頭能知毗尼法藏今在天上尸利沙樹園住三十三天上合棔樹遣使請來迦葉差下座比丘名善覺往召彼憍梵見來非常怪異問彼使曰何事得來閻浮提中不有魔事乃至佛滅不耶我師和尚舍利弗在不我同和尚目乾連在不使言並不忍見佛涅槃於先滅度更問使言佛已滅度更有何事應盡說之答言佛已涅槃結集三藏故請尊者傳受律文唯願慈悲降臨彼衆彼聞佛及本師舍利弗目連等已入涅槃遂嘆無常化火焚身應時滅度火中流乳乳中有聲說伽他曰憍梵鉢提稽首禮妙衆第一大德僧聞佛涅槃我亦爾如大象去象子隨時使從天收三衣鉢還至石室迦葉入雞山而不歸者賢劫章疏云迦葉在雞足山入滅盡定待彌勒下生將三衣鉢及十八種物現見彌勒龍華會助佛揚化雞足山者何云雞足山三峰仰如雞足迦葉以神力入此山坐還合此山其十八種物定力任持阿難蹈恆水而長往者付法藏傳云大迦葉以法付阿難阿難承命廣宣正法有一比丘妄說法句阿難示教彼不從命因此感嘆往毗舍離恆河中流入般涅槃又西域記第七云阿難到殑伽河升空入滅化火焚骸骸中又析舍利分為二分一墮南岸與摩竭陀王一墮北岸與吠舍厘王帝釋往昔有三十二人以為同伴有善法夫人歡喜園生人歡喜夫人設支夫人同修勝業故生天中有善法堂園生樹歡喜園設支夫人此等因緣如餘處說帝釋過去名繭兒即是賤人曹主艱貧令其與人家作為他守獄其性多慈每見獄囚心生不忍方便安隱令常歡喜諸囚賀鬼如得出已各留一事衣賞不經年內財物盈家曹主見喜遂放從良其人得放已後與朋友三十二人因茲結會同修勝業相謂曰宿種盜因今為僕隸從宜阪修尊勝業每見險道往來效力平治修飭日陪功多不經歲月險路皆平後有相君行此國境至此縣境見道平坦裁蒔蒙密便問縣令宰君答云此縣有一賤人結人引修結善非其聞己乃為奏聞得為本郡縣令後為本部縣令遂聘一妻目為善法夫人勝心不止又納一妻漸取至三謂歡喜園生設支夫人置立一堂善法夫人施寶瓶須云善法堂第二夫人種樹名花異果供養感遂目為歡喜園第三夫人復買地栽樹既蘊清涼林木繁密號為生樹第四夫人唯事嬌妍不修勝福三個謂曰汝何不修福乎第四夫人云汝三個夫人既被輕賤曲求其意所以修福欲貪寵愛我自得寵何用福乎其縣令生忉利天中殊勝殿內三十二人亦同生彼於城西面各有八宮為帝臣釋輔翼而住即有善法法堂歡喜園園生樹時帝釋觀天眼見設支作水札鳥在於池邊食諸水族時帝釋化其身為水札鳥同居此鳥其後即將水札鳥上天安其架上未盈暑夕三介夫人同見各述往因禪鳥笑弄鳥慚無措因即欲歸舊居帝釋與三皈五戒言第一不煞生是水札鳥或能持不答言能持乃至四戒亦爾既受戒已後帝釋禮之於上士變化身為死魚隨流而下至於鳥藪如是忍餓不食七日遂致命終若持戒時心生念言我若生天不如三界中為此之願不生天中乃於修羅宮中時帝釋觀察見不升天生於何處後乃於修羅宮中生作美女為帝釋夫人餘家釋修羅女最妖嬈天帝聞之遣使求索修羅云帝釋福德令我得座七寶宮殿我女與之帝釋以寶冠擬海即成寶殿修羅歡喜遂即嫁與因以帝釋修羅相戰言修羅亦云執日者執者障也修羅名曰非天四天王天先與其戰日月天子放盛光明射非天之眼此為非天前鋒以手執日障蔽其光故曰執日日月薄蝕自此而興此事廣如司南第三內釋此是略抄三焦咋焦反音顀僥五聊反國名也人長一尺五寸音堯阿難結集今略陳綱要以作五了一結集時二結集主三結集處四結集衆五結集人初時者為佛涅槃大地六種震動江河倒流暴風卒起百獸哮吼命盡諸天人神號咷悲泣哽咽法大聖人亦皆滅度佛滅度後第一七日造棺槨成第二七日佛在棺中於俱尸那城四門出入一切大衆隨後往來第三七日棺在香臺人天共燒不能令燃至第七日迦葉方來更洗佛身千疊纏裹入棺已後內火自燃一日之間燒之都盡舍利八分八國分之將至本國中各令起塔比丘自收燒佛灰燼以為一塔燒佛床座以為一塔後至四月十五日十塔一時成就至十六日安居結夏總量舍利有八石四升香姓婆羅門衆遣量之也二主者如來涅槃六欲諸天乃至遍得諸天心自念言象王既去象子亦隨法商已過去從誰求法寶至迦葉所禮拜而說先自年欲恚慢已除其形譬如紫金柱上下端度妙無比眼目清得猶蓮花說偈讚已白迦葉言人者不知法城已頠法海已竭法幢已倒法燈已滅行道者少惡人轉盛願以慈悲建立佛法時大迦葉心大如海證得不動默然受請遂即答言我正欲作汝今復請汝等今者且還所止諸天奉命各各而退時大迦葉便更念言若結集者應須施主我今應往未生怨王所令彼具辦迦葉進路正逢王來王見迦葉從象墜下迦葉神力接之令王免墮地復聞佛滅悶絶而死迦葉先作七木葉槽知王聞佛滅必定悶絶以王於槽周回七返王方醒悟因說結集具備皆足三處者西域記云摩竭陀國古先君王所都之處城名矩奢揭羅此云上茅為此域中多出勝上吉祥茅草故云上茅崇山四周以為外廓西通狹徑北闢山門東西長南北狹周一百五十餘里內宮子城周四十里城北門外行一里餘至迦蘭羅陀竹林園園西南上行五六里南山之陰北山之陽未生怨王為結集僧造斯石室其室寬廣受千餘僧四事所須並皆充足飲食百味無一不周四衆者智度論云迦葉受請為結集故至須彌山頂擊金揵槌而說偈言諸大弟子若念於佛當報佛恩莫般涅槃十方世界皆聞此語諸大弟子飛來集會至石室所迦葉告言未來衆生深可憐愍諸聖且待莫入涅槃結集事訖方可隨意於時總得九百九十九人唯除阿難猶在學地衆人白言結集之人事須無學憍梵現在忉利天上應可囑之一則數滿千人二則堪受律藏衆差一小羅漢飛往命之憍梵見來非常怪異問彼使曰何事得來閻浮提中不有魔事乃至佛滅盡不耶我師和尚舍利弗在不我同和尚目乾連在不使言並不忍見佛涅槃於先滅度更問使言佛已滅度更有何事應盡說之遂答之言佛已入滅結集三藏故請尊者傳授律文唯願慈悲降臨彼衆憍梵波提遂嘆無常化火焚身應時滅度火中流乳至石室門乳中有聲說伽他曰憍梵鉢提稽首禮妙衆第一大德僧聞佛涅槃我亦爾如大象去象子隨時使從天收三衣鉢還至石室是時一切國王四衆圍繞石室十二由旬魔出畏聲四衆驚怖阿難迦葉攝伏魔來負以三尸人狗蛇等魔被降已結集方成也五人者所謂慶喜及優波利由慶喜身先住學地迦葉衆內先罰阿難如來在時五踈失事一者佛意不度女人由汝請開以是正法壞五百年汝應須告罪懺悔阿難答言三世諸佛皆有四衆二者如來俱尸耶城中背痛而臥言我須水何不汲取阿難答言五百乘車截流而過令水濁故由是不耶迦葉復言正使水濁佛有神力能令大海水濁還清汝何不取是汝之罪應告罪懺悔三者迦葉復言佛問汝云若有能修四神品者住壽一劫若減一劫我今好修而不答如是三問而汝默然由此令佛早取滅度阿難答言由魔蔽故四者踩僧伽梨衣何故足迹阿難答言風吹墮地非懈怠故五者佛涅槃後以陰藏相示諸女人是為五見阿難答言彼諸女人等求署相故懺悔之中一一如前護度女人不汲水開修神足足迹袈裟以陰藏相示諸女人五過應須告罪懺悔以出向外令修無學阿難至外徐步經行初夜之間見修都盡既得羅漢至石室門迦葉令從鑰孔而入入衆奉命即令垂座集修多羅藏次差優波利結集律藏復集論藏羅漢有為阿難從是已來聖教相續界內結集名上座部迦葉為上首故界外結集在後來者無別標首但名大衆部也或云阿難一身有三名別阿難陀阿難賢阿難海如次結集毗尼阿毗達摩修多羅也或聲聞緣覺菩薩藏藏等阿難如其次第結集也已上明小乘三藏大乘三藏智度論第二云彌勒文殊將彼阿難於鐵圍山結集大乘菩薩三藏阿難主經富樓那掌論優波利守律兩處結集各有三藏所集之主不離四人小乘藏法迦葉集也瘡疣顯隱詞云身上瘡高出者為疣為坎臼者名瘡又隨疏云瘡疣煩惱之異者瘡是瘡疾疣者贅謂剩肉也煩惱中五鈍便名瘡五利便名疣或可分別名瘡俱生名疣也就命時到命盡也又賢愚經云就死時至也因緣俱勝因謂發心緣謂聞法也出家為道為去音求也證也如法華經彼龍女故法華經第四云文殊師利言我於海中唯常宣說妙法華經智積問文殊師利言此經甚深微妙諸經中寶世所希有頗有衆生勤加精進修行此經速得佛不文殊師利言有裟竭羅龍王女年始八歲智惠利根能至菩提智積菩薩言我見釋迦如來於無量劫難行苦行積功纍德求菩薩道未兼止息觀三千大千世界乃至無有如芥子許非是菩薩捨身命處為衆生故然後乃得成菩提道不信此女於須臾傾便成正覺時舍利弗語龍女言女謂不久得無上道是事難信所以者何女身垢穢非是法器云何能得無上菩提佛道懸曠經無量劫勤苦積行具修諸度然後乃成又女身猶有五障一者不得作梵天王二者帝釋三魔王四者轉輪聖王五者佛身云何女身速得成佛爾時龍女有一寶珠價直三千大千世界持以上佛佛即受之龍女謂智積菩薩尊者舍利弗言我獻寶珠世尊納受是事疾不答言甚疾女言以汝神力觀我成佛復速於此當時會衆皆見龍女忽然之間變成男子具菩薩行即往南方無垢世界坐寶蓮花成等正覺三十二相八十種好普為十方一切衆生演說妙法違前二科三等無咎不思議品須彌芥子何得相容須彌平無相學體是空以空納無相何得不相容又須彌芥子相入如何如碰不吸懺瑚珀捨草卑麻油燃燃蛇影自現等又科為二依內外違前二科即前三品明其內護後之三品明其外護又科為三依然引三等無咎前三為內第四為外下二為總總彰經德總明前二又科為四依總中引別如二文總中分二先顯經德示不思議後總彰前具明二護又科為五依別中總初二為內內彰勝劣次辨總依通前及後次為外護滿本所求次因散花表經奇特後總前四內外依持十三法師從因至果十六國王等無上寶故又科為六依勝顯開初因別果別為六合為一故依二判中內非無外外非無內各依勝顯彰內外故加行資糧二乘異生見有異也最勝王疏第五卷云又變化分略有二種一者小化王一四洲異生二乘資糧所見二者大化王三千界四加行位菩薩所見我今盧舍那等者梵網經疏云若依此經蓮華臺藏世界之中坐花臺上實身成佛名盧舍那其千花上千釋迦則是千摩醯首羅天上各有一釋迦此千釋迦一一各化作百億釋迦故有千百億釋迦於千百億國中菩提樹下一時成佛自受用身者能令自他受用種種法樂自即是自受用身受用力無畏等種種法即樂故唯佛即佛乃能知之菩薩二千子非可知也他即他受用身為十地便令他菩薩受用法樂故也住解脫位望菩薩果名資糧望涅槃果故名解脫解脫分故名解脫位伏忍聖胎三十人十住十行十回向三世諸佛於中學無不由此伏忍生四曰種性菩薩習種銅輪二天下修十住行結為顯曰發心治修行生貴具方便正心及不退童真王灌頂三練磨心三乘入道疏抄云第一菩提廣大屈引他況已練聞修大乘行經三無數劫不如三生六十劫四生一百劫取二乘因果也引他況已練者頌云十方世界諸有情念念已發善逝果彼既丈夫我亦爾三何自輕而退屈第二萬萬行難修屈省增修練聞修施等心便退屈謁修施等萬行時須頭與頭須眼與等極以難行應求小果省己增修練者頌云汝已惡道經多劫無益受苦省能超少行苦得菩提大利不應生退屈第三轉依難證屈引粗況妙練者頌云薄比凡夫初發心省擬欲求菩提果汝已精進經多劫云何退屈苦沈淪性種性菩薩銀輪三天性種性十行結為頌曰歡喜饒無違無屈離癡亂善現無難得善法真實行無著無縛等法界虛誑謂妄語也離間謂兩舌也粗惡謂惡口也雜穢謂倚語也由多荊確學為二音確謂地瘦而硬多諸石也果多辛辣來繞反辛甚也滅盡定繞行地隨疏云即心心所法一聚悉皆滅盡故云滅盡也轉依義別略有四種一能轉道二所轉依三所轉捨四所轉得如彼第十廣分別故十三法師奉持文者從初習忍至金剛定如法修行至具一切智十六國王奉持文從佛告波斯匿王言我滅度後至信受奉行對翻咒何不講凡諸咒法皆是密言以此密詞能含至理加行念惠勤而誦持卻禍集福革成聖故無翻對亦不解釋火字二現喻一現業種火字二不見業種子不可見何以為喻奉已見邊顯不見故因明論疏云謂以所見邊與未見邊和合而說所見邊者謂以顯了分明未所見邊者謂未顯了分明以顯了分明顯未顯了分令義平等順現法受者謂此生造即此生熟順次生受者謂此生造第二生熟順後次受者謂此生造從第三生後次第熟又業有三業於時分定異熟不定謂順現等三非定得異熟一者有業於異熟定時分定謂不定業定得異熟二者有業於二俱定謂順現等定得異熟三者有業於二俱不定謂不定業非定得異熟録文完方廣錩修訂終審
